spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: influx

  application:
    name: rule-engine

logging:
  level:
    com.nhnacademy.ruleengine: DEBUG


rule-engine:
  mqtt:
    external:
      broker-url: tcp://10.116.64.13:1883
      client-id-prefix: rule-engine-subscriber
      topic: application/+/device/+/event/up
      qos: 1

    internal:
      broker-url: tcp://localhost:1883
      client-id-prefix: rule-engine-internal-publisher
      topic-prefix: iot
      qos: 1